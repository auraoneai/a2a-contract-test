name: Test A2A Agent Contracts
description: Validate an A2A-style agent card and recorded task lifecycle transcript without contacting the agent.
author: AuraOne
branding:
  icon: git-branch
  color: purple
inputs:
  agent-card:
    description: Repository-relative path to the agent card JSON file.
    required: true
  transcript:
    description: Optional only when contract-transcript.json is next to the agent card; otherwise provide its path.
    required: false
  output:
    description: Repository-relative Markdown report path; its parent directory must already exist.
    required: false
    default: a2a-contract-report.md
runs:
  using: composite
  steps:
    - run: python -m pip install "${{ github.action_path }}"
      shell: bash
    - run: |
        if [ -n "${{ inputs.transcript }}" ]; then
          a2a-contract-test run --agent-card "${{ inputs.agent-card }}" --transcript "${{ inputs.transcript }}" --out "${{ inputs.output }}"
        else
          a2a-contract-test run --agent-card "${{ inputs.agent-card }}" --out "${{ inputs.output }}"
        fi
      shell: bash
